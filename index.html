<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Performance Review CPG</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

@font-face { font-family: 'Neue Haas Display'; src: url('fonts/NeueHaasDisplayRoman.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Neue Haas Display'; src: url('fonts/NeueHaasDisplayMediu.ttf') format('truetype'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'Neue Haas Display'; src: url('fonts/NeueHaasDisplayBold.ttf')  format('truetype'); font-weight: 700; font-display: swap; }

:root {
  --gray-0:#FFF; --gray-50:#F7F7F7; --gray-100:#F5F5F5; --gray-200:#EBEBEB;
  --gray-300:#D1D1D1; --gray-400:#A3A3A3; --gray-500:#7B7B7B; --gray-600:#5C5C5C;
  --gray-700:#333; --gray-800:#262626; --gray-900:#1C1C1C; --gray-950:#0B0B0D;
  --slate-300:#CACFD8; --slate-400:#99A0AE; --slate-500:#717784; --slate-600:#525866;
  --orange-50:#FFF3EB; --orange-100:#FFE6D5; --orange-400:#FFA468; --orange-500:#FA7319;
  --orange-600:#E16614; --orange-700:#CE5E12;
  --orange-alpha-10:rgba(250,115,25,0.10); --orange-alpha-16:rgba(250,115,25,0.16);
  --red-50:#FFEBEC; --red-100:#FFD5D8; --red-500:#FB3748; --red-700:#D02533;
  --green-50:#E0FAEC; --green-100:#D0FBE9; --green-500:#1FC16B; --green-600:#1DAF61;
  --green-700:#178C4E; --green-800:#1A7544;
  --yellow-50:#FFFAEB; --yellow-100:#FFEFCC; --yellow-500:#F6B51E; --yellow-800:#A78025;
  --purple-50:#EFEBFF; --purple-100:#DCD5FF; --purple-500:#7D52F4; --purple-700:#5B2CC9;
  --sky-50:#EBF8FF; --sky-100:#D5F1FF; --sky-600:#35ADE9; --sky-700:#2597D0;
  --blue-500:#335CFF; --pink-600:#E9358F; --teal-600:#1DAF9C;
  --primary-base:var(--orange-500); --primary-dark:var(--orange-600);
  --primary-darker:var(--orange-700); --primary-alpha-10:var(--orange-alpha-10);
  --primary-alpha-16:var(--orange-alpha-16);
  --bg-weak-50:var(--gray-50); --bg-white-0:var(--gray-0);
  --text-strong-950:var(--gray-900); --text-sub-600:var(--gray-600);
  --text-soft-400:var(--gray-400); --text-disabled-300:var(--gray-300);
  --stroke-soft-200:var(--gray-200); --stroke-sub-300:var(--gray-300);
  --shadow-xs:0 1px 2px 0 rgba(10,13,20,0.03);
  --shadow-sm:0 2px 4px 0 rgba(27,28,29,0.04);
  --shadow-md:0 16px 32px -12px rgba(14,18,27,0.10);
  --shadow-button:0 1px 2px 0 rgba(27,28,29,0.04),inset 0 -1px 1px 0 rgba(255,255,255,0.24);
  --shadow-focus:0 0 0 2px var(--primary-alpha-16);
  --font-display:'Neue Haas Display',system-ui,sans-serif;
  --font-body:'Neue Haas Display',system-ui,sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:var(--font-body);background:#E9E9EC;color:var(--text-strong-950);
  -webkit-font-smoothing:antialiased;font-size:14px;height:100%;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:transparent;color:inherit}
textarea,input{font-family:inherit}

#root{width:100%;height:100%}
.pf-app{display:grid;grid-template-columns:244px 1fr;width:100%;height:100vh;
  background:var(--bg-weak-50);overflow:hidden}

/* ── Sidebar ── */
.pf-sidebar{background:var(--gray-950);color:#fff;display:flex;flex-direction:column;
  padding:18px 12px 12px;overflow-y:auto}
.pf-brand{display:flex;align-items:center;gap:11px;padding:6px 6px 16px;
  border-bottom:1px solid rgba(255,255,255,0.07);margin-bottom:16px}
.pf-brand-tile{width:38px;height:38px;border-radius:11px;flex:none;
  background:linear-gradient(150deg,var(--orange-400),var(--orange-600));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08),inset 0 -1px 1px rgba(255,255,255,0.3)}
.pf-brand-tile-img{width:38px;height:38px;border-radius:11px;flex:none;object-fit:cover;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08)}
.pf-brand-text{flex:1;min-width:0}
.pf-brand-name{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.pf-brand-sub{font-size:11px;color:var(--slate-500);margin-top:1px}
.pf-brand-chev{color:var(--slate-500);font-size:16px}
.pf-team{display:flex;align-items:center;gap:10px;width:100%;padding:8px;
  border-radius:10px;text-align:left;background:rgba(255,255,255,0.04);
  border:1px solid rgba(255,255,255,0.07);margin-bottom:18px;transition:background 120ms}
.pf-team:hover{background:rgba(255,255,255,0.07)}
.pf-team-tile{width:32px;height:32px;border-radius:9px;flex:none;font-size:12px;
  font-weight:700;color:#fff;letter-spacing:0.02em;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(150deg,var(--purple-500),var(--purple-700))}
.pf-team-text{flex:1;min-width:0}
.pf-team-name{font-size:13.5px;font-weight:600;color:#fff}
.pf-team-sub{font-size:11px;color:var(--slate-500);margin-top:1px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pf-team-chev{color:var(--slate-500);font-size:16px;flex:none}
.pf-q-tabs{display:flex;gap:3px;margin-bottom:14px;background:rgba(255,255,255,0.05);
  border-radius:9px;padding:3px}
.pf-q-tab{flex:1;padding:5px 4px;border-radius:7px;font-size:11px;font-weight:600;
  color:var(--slate-500);text-align:center;transition:background 120ms,color 120ms;
  letter-spacing:0.02em}
.pf-q-tab.active{background:rgba(255,255,255,0.13);color:#fff}
.pf-q-tab:hover:not(.active){color:var(--slate-300)}
.pf-section-label{font-size:10px;font-weight:600;letter-spacing:0.08em;
  color:var(--slate-500);text-transform:uppercase;padding:0 8px 8px}
.pf-nav{display:flex;flex-direction:column;gap:3px}
.pf-member{display:flex;align-items:center;gap:11px;padding:8px 9px;border-radius:10px;
  text-align:left;transition:background 120ms;width:100%}
.pf-member:hover{background:rgba(255,255,255,0.05)}
.pf-member.active{background:rgba(255,255,255,0.09)}
.pf-avatar-photo{border-radius:50%;object-fit:cover;flex:none;width:30px;height:30px;
  filter:sepia(0.25) saturate(1.3) brightness(0.88) contrast(1.05);
  border:1.5px solid transparent}
.pf-member.active .pf-avatar-photo{border-color:rgba(255,255,255,0.28)}
.pf-hero-avatar-photo{width:60px;height:60px;border-radius:16px;flex:none;object-fit:cover;
  filter:sepia(0.25) saturate(1.3) brightness(0.88) contrast(1.05);
  box-shadow:inset 0 -1px 2px rgba(255,255,255,0.3)}
.pf-avatar{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-weight:600;flex:none;width:30px;height:30px;font-size:11px;
  border:1.5px solid transparent}
.pf-member.active .pf-avatar{border-color:rgba(255,255,255,0.28)}
.pf-member-text{flex:1;min-width:0;display:flex;flex-direction:column}
.pf-member-name{font-size:13px;font-weight:600;color:var(--slate-300);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-member.active .pf-member-name{color:#fff}
.pf-member-role{font-size:10.5px;color:var(--slate-500);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.pf-member-score{font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;flex:none}
.pf-member-dot{width:7px;height:7px;border-radius:50%;background:var(--slate-600);
  flex:none;margin-right:7px}
.pf-spacer{flex:1}
.pf-user{display:flex;align-items:center;gap:10px;padding:10px 8px 4px;
  border-top:1px solid rgba(255,255,255,0.07);margin-top:12px}
.pf-user-avatar{width:32px;height:32px;border-radius:50%;background:var(--gray-700);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;
  font-weight:600;flex:none}
.pf-user-avatar-photo{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none}
.pf-user-text{flex:1;min-width:0}
.pf-user-name{font-size:13px;font-weight:600;color:#fff}
.pf-user-role{font-size:11px;color:var(--slate-500)}
.pf-user-chev{color:var(--slate-500)}

/* ── Main ── */
.pf-main{overflow-y:auto;height:100vh;display:flex;flex-direction:column}
.pf-top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;
  padding:16px 28px;background:rgba(247,247,247,0.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--stroke-soft-200);flex:none}
.pf-crumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-soft-400)}
.pf-crumb b{color:var(--text-strong-950);font-weight:600}
.pf-crumb i{font-size:15px}
.pf-top-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.pf-lang{display:flex;align-items:center;background:var(--bg-white-0);
  border:1px solid var(--stroke-soft-200);border-radius:8px;padding:3px;
  box-shadow:var(--shadow-xs)}
.pf-lang button{font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;
  color:var(--text-soft-400);letter-spacing:0.02em}
.pf-lang button.on{background:var(--gray-900);color:#fff}
.pf-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;
  border-radius:9px;font-size:13px;font-weight:500;transition:background 120ms}
.pf-btn i{font-size:15px}
.pf-btn-secondary{background:var(--bg-white-0);color:var(--text-strong-950);
  border:1px solid var(--stroke-soft-200);box-shadow:var(--shadow-xs)}
.pf-btn-secondary:hover{background:var(--bg-weak-50)}
.pf-btn-primary{background:var(--primary-base);color:#fff;box-shadow:var(--shadow-button)}
.pf-btn-primary:hover{background:var(--primary-dark)}

/* ── Loading / Error ── */
.pf-center{display:flex;flex-direction:column;align-items:center;justify-content:center;
  flex:1;gap:14px;padding:60px}
.pf-spinner{width:36px;height:36px;border:3px solid var(--gray-200);
  border-top-color:var(--orange-500);border-radius:50%;
  animation:spin 700ms linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pf-center-label{font-size:14px;color:var(--text-soft-400);font-weight:500}
.pf-error-ico{font-size:32px;color:var(--red-500)}

/* ── Content ── */
.pf-content{padding:22px 28px 40px;display:flex;flex-direction:column;gap:18px;flex:1}

/* ── Hero ── */
.pf-hero{background:var(--bg-white-0);border:1px solid var(--stroke-soft-200);
  border-radius:16px;box-shadow:var(--shadow-xs);display:flex;align-items:stretch}
.pf-hero-profile{display:flex;gap:16px;padding:24px 26px;flex:1;align-items:center}
.pf-hero-avatar{width:60px;height:60px;border-radius:16px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:22px;font-weight:600;
  box-shadow:inset 0 -1px 2px rgba(255,255,255,0.3)}
.pf-hero-name{font-size:24px;font-weight:600;letter-spacing:-0.02em;line-height:1.1}
.pf-hero-meta{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.pf-chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;
  color:var(--text-sub-600);background:var(--bg-weak-50);
  border:1px solid var(--stroke-soft-200);padding:3px 10px;border-radius:999px}
.pf-chip i{font-size:13px;color:var(--text-soft-400)}
.pf-hero-divider{width:1px;background:var(--stroke-soft-200);margin:20px 0}
.pf-hero-score{display:flex;align-items:center;gap:18px;padding:20px 28px}
.pf-gauge{position:relative;width:110px;height:110px;flex:none}
.pf-gauge svg{transform:rotate(-90deg)}
.pf-gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.pf-gauge-num{font-family:var(--font-display);font-size:32px;font-weight:600;
  letter-spacing:-0.02em;line-height:1}
.pf-gauge-den{font-size:12px;color:var(--text-soft-400);font-weight:500;margin-top:2px}
.pf-score-meta{display:flex;flex-direction:column;gap:8px}
.pf-eyebrow{font-size:10px;font-weight:600;letter-spacing:0.08em;
  text-transform:uppercase;color:var(--text-soft-400)}
.pf-status-pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;
  font-size:12px;font-weight:600;padding:4px 11px;border-radius:999px}
.pf-hero-stats{display:flex;flex-direction:column;justify-content:center;
  gap:0;padding:20px 24px 20px 0}
.pf-mini{display:flex;align-items:center;gap:11px;padding:10px 0}
.pf-mini:not(:last-child){border-bottom:1px solid var(--bg-weak-50)}
.pf-mini-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;font-size:15px;flex:none}
.pf-mini-num{font-size:17px;font-weight:600;letter-spacing:-0.01em}
.pf-mini-lab{font-size:11px;color:var(--text-soft-400)}

/* ── Alerts ── */
.pf-alerts{background:var(--bg-white-0);border:1px solid var(--stroke-soft-200);
  border-radius:16px;box-shadow:var(--shadow-xs);overflow:hidden}
.pf-alerts-head{display:flex;align-items:center;gap:10px;padding:16px 22px;
  border-bottom:1px solid var(--bg-weak-50);background:var(--red-50)}
.pf-alerts-head .ico{width:28px;height:28px;border-radius:8px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  background:rgba(251,55,72,0.12);color:var(--red-500)}
.pf-alerts-title{font-size:14px;font-weight:600;color:var(--red-700)}
.pf-alerts-sub{font-size:12px;color:var(--red-500);margin-top:1px}
.pf-alerts-list{padding:0}
.pf-alert-row{display:flex;align-items:center;gap:12px;padding:11px 22px;
  border-bottom:1px solid var(--bg-weak-50)}
.pf-alert-row:last-child{border-bottom:0}
.pf-alert-dot{width:8px;height:8px;border-radius:50%;flex:none}
.pf-alert-text{flex:1;min-width:0}
.pf-alert-skill{font-size:13px;font-weight:500}
.pf-alert-pillar{font-size:11.5px;color:var(--text-soft-400);margin-top:1px}
.pf-alert-score{font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;flex:none}

/* ── Pillar grid ── */
.pf-pillar-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.pf-pillar-card{background:var(--bg-white-0);border:1px solid var(--stroke-soft-200);
  border-radius:16px;box-shadow:var(--shadow-xs);overflow:hidden}
.pf-pillar-head{display:flex;align-items:center;gap:10px;padding:16px 20px;
  border-bottom:1px solid var(--bg-weak-50)}
.pf-pillar-head .ico{width:30px;height:30px;border-radius:8px;flex:none;
  display:flex;align-items:center;justify-content:center;font-size:16px}
.pf-pillar-title{font-size:14px;font-weight:600;letter-spacing:-0.005em}
.pf-pillar-sub{font-size:11px;color:var(--text-soft-400);margin-top:1px}
.pf-pillar-avg{margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;
  border-radius:999px;flex:none}

/* ── Skill rows ── */
.pf-skill-row{padding:11px 20px;border-bottom:1px solid var(--bg-weak-50)}
.pf-skill-row:last-child{border-bottom:0}
.pf-skill-name{font-size:13px;font-weight:500;margin-bottom:8px;
  color:var(--text-strong-950)}
.pf-months{display:flex;flex-wrap:wrap;gap:5px}
.pf-month-pill{display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.pf-month-pill .mo{color:inherit;opacity:0.65}
.pf-month-pill .sc{color:inherit}

/* ── Empty state ── */
.pf-pending{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:70px 32px;text-align:center;flex:1}
.pf-pending-avatar{width:68px;height:68px;border-radius:20px;display:flex;
  align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:600;
  margin-bottom:16px}
.pf-pending-name{font-size:21px;font-weight:600;letter-spacing:-0.01em}
.pf-pending-role{font-size:13px;color:var(--text-soft-400);margin-top:3px}
.pf-pending-card{margin-top:24px;background:var(--bg-white-0);
  border:1px solid var(--stroke-soft-200);border-radius:16px;
  box-shadow:var(--shadow-xs);padding:32px 38px;max-width:440px;
  display:flex;flex-direction:column;align-items:center}
.pf-pending-card>i{font-size:30px;color:var(--text-disabled-300);margin-bottom:12px}
.pf-pending-card-title{font-size:15px;font-weight:600}
.pf-pending-card-body{font-size:13px;color:var(--text-sub-600);margin-top:7px;line-height:1.55}

/* ── Workload chart ── */
.pf-workload{background:var(--bg-white-0);border:1px solid var(--stroke-soft-200);
  border-radius:16px;box-shadow:var(--shadow-xs);padding:22px 26px}
.pf-workload-head{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.pf-workload-title{font-size:15px;font-weight:600}
.pf-workload-sub{font-size:12px;color:var(--text-soft-400);margin-top:2px}
.pf-wl-legend{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
.pf-wl-legend-item{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text-sub-600)}
.pf-wl-legend-dot{width:8px;height:8px;border-radius:2px;flex:none}
.pf-chart{display:flex;align-items:flex-end;gap:16px;height:140px;padding-top:8px}
.pf-chart-group{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.pf-chart-bars{display:flex;align-items:flex-end;gap:3px;height:110px;width:100%}
.pf-chart-bar{flex:1;border-radius:4px 4px 0 0;min-height:3px;transition:height 500ms cubic-bezier(.4,0,.2,1);
  cursor:default;position:relative}
.pf-chart-bar:hover::after{content:attr(data-val);position:absolute;top:-22px;left:50%;
  transform:translateX(-50%);background:var(--gray-900);color:#fff;font-size:10px;
  padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
.pf-chart-mo{font-size:11px;color:var(--text-soft-400);font-weight:500}
.pf-chart-empty{display:flex;align-items:center;justify-content:center;height:110px;
  color:var(--text-disabled-300);font-size:13px}

/* ── Editable score pills ── */
.pf-month-pill{cursor:pointer;transition:opacity 120ms,outline 120ms}
.pf-month-pill:hover{opacity:0.82;outline:2px solid var(--primary-base);outline-offset:1px}
.pf-month-pill.editing{padding:0;overflow:hidden;outline:2px solid var(--primary-base);outline-offset:1px}
.pf-score-input{width:46px;height:100%;border:none;background:transparent;text-align:center;
  font-size:11.5px;font-weight:600;color:inherit;padding:4px 2px;outline:none}
.pf-sb-dot{width:5px;height:5px;border-radius:50%;background:var(--orange-500);
  flex:none;margin-left:2px;margin-top:-6px}

</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// ─── CONFIG ───────────────────────────────────────────────────────────────
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyf1-cN6vbg0at20BTWj-8llDV5S_n4kdE7SQSFg2E3mZ7DK2Mh1x81y5TZgLP0mLexZg/exec';
const SUPABASE_URL    = 'https://uwftcnjtvwjlufjyyyfh.supabase.co';
const SUPABASE_KEY    = 'sb_publishable_b3x3Up6jnCHd57IKgnGvJQ_LgDaxux8';

async function mondayQuery(query) {
  const res = await fetch('https://api.monday.com/v2', {
    method: 'POST',
    headers: {
      'Authorization': MONDAY_TOKEN,
      'Content-Type': 'application/json',
      'API-Version': '2024-01',
    },
    body: JSON.stringify({ query }),
  });
  return res.json();
}

function parseMondayDate(val, text) {
  // text field: plain "YYYY-MM-DD" — most reliable, no timezone issues
  if (text && /^\d{4}-\d{2}-\d{2}$/.test(text.trim())) {
    const [y, m, d] = text.trim().split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  // val field: JSON {"date":"YYYY-MM-DD","time":""}
  if (!val) return null;
  try {
    const parsed = JSON.parse(val);
    if (parsed && parsed.date) {
      const [y, m, d] = parsed.date.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
  } catch {}
  return null;
}

function getMonthAbbr(date) {
  if (!date) return null;
  return NUM_TO_ABBR[date.getMonth() + 1] || null;
}

async function fetchMondayWorkload(memberDisplayName, isListBuilder) {
  const counts = {};
  // Match by first name OR last name against the text field of the person column
  const nameParts = memberDisplayName.toLowerCase().split(' ').filter(Boolean);

  function personMatches(personText) {
    const t = (personText || '').toLowerCase();
    return nameParts.some(part => part.length > 2 && t.includes(part));
  }

  const personCol = isListBuilder ? LB_COLS.person : CM_COLS.person;
  const boardId   = isListBuilder ? PROPOSALS_BOARD : EXECUTION_BOARD;
  const statPairs = isListBuilder
    ? [['building', LB_COLS.building], ['approved', LB_COLS.approved], ['declined', LB_COLS.declined]]
    : [['ongoing', CM_COLS.ongoing], ['completed', CM_COLS.completed]];
  const colIds = [personCol, ...statPairs.map(([,id]) => id)];

  const boardRes = await mondayQuery(`{
    boards(ids: [${boardId}]) {
      items_page(limit: 500) {
        items {
          column_values(ids: ${JSON.stringify(colIds)}) {
            id value text
          }
        }
      }
    }
  }`);

  const items = boardRes?.data?.boards?.[0]?.items_page?.items || [];
  items.forEach(item => {
    const cols = {};
    item.column_values.forEach(c => { cols[c.id] = { value: c.value, text: c.text }; });

    if (!personMatches(cols[personCol]?.text)) return;

    statPairs.forEach(([status, colId]) => {
      const mo = getMonthAbbr(parseMondayDate(cols[colId]?.value, cols[colId]?.text));
      if (!mo) return;
      if (!counts[mo]) counts[mo] = {};
      counts[mo][status] = (counts[mo][status] || 0) + 1;
    });
  });

  return counts;
}

function scoreColor(s) {
  if (!s || s === 0) return { bg:'var(--gray-100)', fg:'var(--gray-500)' };
  if (s < 2.5)        return { bg:'var(--red-50)',    fg:'var(--red-700)',    solid:'var(--red-500)' };
  if (s < 3.0)        return { bg:'var(--orange-50)', fg:'var(--orange-700)', solid:'var(--orange-500)' };
  if (s < 3.5)        return { bg:'var(--yellow-50)', fg:'var(--yellow-800)', solid:'var(--yellow-500)' };
  if (s < 4.2)        return { bg:'var(--green-50)',  fg:'var(--green-700)',  solid:'var(--green-500)' };
  return               { bg:'var(--green-100)', fg:'var(--green-800)',  solid:'var(--green-600)' };
}

function pillarAvg(pillar, months) {
  const vals = [];
  (pillar.skills || []).forEach(sk => {
    months.forEach(m => {
      if (sk.scores[m]) vals.push(sk.scores[m]);
    });
  });
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function overallAvg(pillars, months) {
  const vals = [];
  (pillars || []).forEach(p => {
    (p.skills || []).forEach(sk => {
      months.forEach(m => {
        if (sk.scores[m]) vals.push(sk.scores[m]);
      });
    });
  });
  if (!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function getMemberRole(memberId) {
  const displayName = memberId.replace(/\s*[-–]\s*.*$/, '');
  return ROLE_MAP[displayName] || memberId.match(/[-–]\s*(.+)$/)?.[1]?.trim() || '';
}

function getMemberPhoto(memberId) {
  const displayName = memberId.replace(/\s*[-–]\s*.*$/, '');
  return MEMBER_PHOTOS[displayName] || null;
}

function getInitials(name) {
  return name.replace(/\s*[-–]\s*.*$/, '')
    .split(' ').filter(w => w.length > 1).slice(0, 2)
    .map(w => w[0].toUpperCase()).join('');
}

function parsePillarTitle(name) {
  const m = name.match(/^(.*?)\s*[\(\（](.+?)[\)\）]\s*$/);
  return m ? { title: m[1].trim(), sub: m[2].trim() } : { title: name, sub: '' };
}

function pillarCfg(name) {
  const key = Object.keys(PILLAR_CONFIG).find(k => k !== 'default' && name.includes(k));
  return key ? PILLAR_CONFIG[key] : PILLAR_CONFIG.default;
}

// ─── Gauge ──────────────────────────────────────────────────────────────────
function ScoreGauge({ value }) {
  const r = 44, c = 2 * Math.PI * r, pct = value ? value / 5 : 0;
  const z = value ? scoreColor(value) : { solid:'var(--gray-200)' };
  return (
    <div className="pf-gauge">
      <svg width="110" height="110" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r={r} fill="none" stroke="var(--gray-200)" strokeWidth="10" />
        <circle cx="55" cy="55" r={r} fill="none" stroke={z.solid||'var(--gray-200)'} strokeWidth="10"
          strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c*(1-pct)}
          style={{transition:'stroke-dashoffset 700ms cubic-bezier(.4,0,.2,1),stroke 300ms'}} />
      </svg>
      <div className="pf-gauge-center">
        <div className="pf-gauge-num" style={{color:z.solid||'var(--gray-400)'}}>
          {value ? value.toFixed(1) : '—'}
        </div>
        {value && <div className="pf-gauge-den">/ 5.0</div>}
      </div>
    </div>
  );
}

// ─── Alerts panel ────────────────────────────────────────────────────────────
function AlertsPanel({ pillars, months, L }) {
  const [open, setOpen] = useState(false);

  const alerts = [];
  (pillars || []).forEach(p => {
    (p.skills || []).forEach(sk => {
      const scores = months.map(m => sk.scores[m]).filter(v => v);
      if (!scores.length) return;
      const last = scores[scores.length - 1];
      if (last < ALERT_THRESHOLD) {
        alerts.push({ skill: sk.name, pillar: p.name, score: last });
      }
    });
  });
  if (!alerts.length) return null;

  return (
    <div className="pf-alerts">
      <button className="pf-alerts-head" onClick={() => setOpen(o => !o)}
        style={{width:'100%',textAlign:'left',cursor:'pointer',border:0,background:'inherit',borderRadius:'inherit'}}>
        <div className="ico"><i className="ri-alert-line"></i></div>
        <div style={{flex:1}}>
          <div className="pf-alerts-title">{L({es:'Áreas de atención',en:'Areas of attention'})}</div>
          <div className="pf-alerts-sub">
            {alerts.length} {L({es:'competencias por debajo de 3.0',en:'competencies below 3.0'})}
          </div>
        </div>
        <i className="ri-arrow-down-s-line" style={{
          color:'var(--red-500)',fontSize:18,transition:'transform 200ms',
          transform: open ? 'rotate(180deg)' : 'rotate(0deg)'
        }}></i>
      </button>
      {open && (
        <div className="pf-alerts-list">
          {alerts.map((a, i) => {
            const c = scoreColor(a.score);
            return (
              <div className="pf-alert-row" key={i}>
                <div className="pf-alert-dot" style={{background:c.solid||c.fg}}></div>
                <div className="pf-alert-text">
                  <div className="pf-alert-skill">{a.skill}</div>
                  <div className="pf-alert-pillar">{parsePillarTitle(a.pillar).title}</div>
                </div>
                <div className="pf-alert-score" style={{background:c.bg,color:c.fg}}>
                  {a.score.toFixed(1)}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ─── Pillar card ─────────────────────────────────────────────────────────────
function PillarCard({ pillar, months, member, sbScores, onSave, L }) {
  const [editing, setEditing] = useState(null); // 'pillar|skill|month'
  const [draft,   setDraft]   = useState('');

  const cfg = pillarCfg(pillar.name);
  const { title, sub } = parsePillarTitle(pillar.name);

  function resolveScore(sk, m) {
    const key = `${pillar.name}|${sk.name}|${m}`;
    return sbScores[key] !== undefined ? sbScores[key] : sk.scores[m];
  }

  const allSkillsMonths = [];
  (pillar.skills||[]).forEach(sk => months.forEach(m => {
    const v = resolveScore(sk, m);
    if (v) allSkillsMonths.push(v);
  }));
  const avg = allSkillsMonths.length ? allSkillsMonths.reduce((a,b)=>a+b,0)/allSkillsMonths.length : null;
  const ac = avg ? scoreColor(avg) : { bg:'var(--gray-100)', fg:'var(--gray-400)' };

  function startEdit(sk, m) {
    const key = `${pillar.name}|${sk.name}|${m}`;
    setEditing(key);
    setDraft(String(resolveScore(sk, m) || ''));
  }

  function commitEdit(sk, m) {
    const val = parseFloat(draft);
    if (!isNaN(val) && val >= 0 && val <= 5) {
      onSave(member, pillar.name, sk.name, m, val);
    }
    setEditing(null);
  }

  return (
    <div className="pf-pillar-card">
      <div className="pf-pillar-head">
        <div className="ico" style={{background:cfg.bg,color:cfg.fg}}><i className={cfg.ico}></i></div>
        <div>
          <div className="pf-pillar-title">{title}</div>
          {sub && <div className="pf-pillar-sub">{sub}</div>}
        </div>
        {avg && (
          <div className="pf-pillar-avg" style={{background:ac.bg,color:ac.fg}}>
            {avg.toFixed(1)}
          </div>
        )}
      </div>

      {(pillar.skills || []).filter(sk => {
        const n = sk.name.toLowerCase();
        const t = title.toLowerCase();
        return n !== t && !n.startsWith(t);
      }).map((sk, i) => (
        <div className="pf-skill-row" key={i}>
          <div className="pf-skill-name">{sk.name}</div>
          <div className="pf-months">
            {months.map(m => {
              const key = `${pillar.name}|${sk.name}|${m}`;
              const v = resolveScore(sk, m);
              const fromSb = sbScores[key] !== undefined;
              const c = scoreColor(v);
              const isEdit = editing === key;
              return (
                <span key={m} className={`pf-month-pill${isEdit?' editing':''}`}
                  style={{background:c.bg,color:c.fg}}
                  onClick={() => !isEdit && startEdit(sk, m)}>
                  {isEdit ? (
                    <input className="pf-score-input" autoFocus
                      value={draft} onChange={e => setDraft(e.target.value)}
                      onBlur={() => commitEdit(sk, m)}
                      onKeyDown={e => { if(e.key==='Enter') commitEdit(sk,m); if(e.key==='Escape') setEditing(null); }}
                      style={{color:c.fg}} />
                  ) : (
                    <>
                      <span className="mo">{MONTHS_LABEL[m]}</span>
                      <span className="sc">{v ? v.toFixed(1) : '—'}</span>
                      {fromSb && <span className="pf-sb-dot"></span>}
                    </>
                  )}
                </span>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

// ─── Workload chart ──────────────────────────────────────────────────────────
function WorkloadChart({ memberId, activeMonths, L }) {
  const [wl,      setWl]      = useState(null);
  const [loading, setLoading] = useState(true);
  const [err,     setErr]     = useState(null);

  const displayName = memberId.replace(/\s*[-–]\s*.*$/, '');
  const role = ROLE_MAP[displayName] || '';
  const isLB = role === 'List Builder';

  const statuses = isLB
    ? [
        { key:'building',  label: L({es:'Building',   en:'Building'}),  color:'var(--sky-500)' },
        { key:'approved',  label: L({es:'Approved',   en:'Approved'}),  color:'var(--green-500)' },
        { key:'declined',  label: L({es:'Declined',   en:'Declined'}),  color:'var(--red-500)' },
      ]
    : [
        { key:'ongoing',   label: L({es:'Ongoing',    en:'Ongoing'}),   color:'var(--orange-500)' },
        { key:'completed', label: L({es:'Completed',  en:'Completed'}), color:'var(--green-500)' },
      ];

  useEffect(() => {
    setLoading(true); setErr(null);
    fetchMondayWorkload(displayName, isLB)
      .then(data => { setWl(data); setLoading(false); })
      .catch(e => { setErr(e.message || 'Error connecting to Monday'); setWl({}); setLoading(false); });
  }, [memberId]);

  const maxVal = Math.max(1, ...activeMonths.flatMap(mo =>
    statuses.map(s => wl?.[mo]?.[s.key] || 0)
  ));

  return (
    <div className="pf-workload">
      <div className="pf-workload-head">
        <div className="ico" style={{background:'var(--orange-100)',color:'var(--orange-700)'}}>
          <i className="ri-bar-chart-2-line"></i>
        </div>
        <div>
          <div className="pf-workload-title">Campaigns workflow</div>
          <div className="pf-workload-sub">{L({es:'Campañas por mes · Monday',en:'Campaigns per month · Monday'})}</div>
        </div>
        <div className="pf-wl-legend">
          {statuses.map(s => (
            <div key={s.key} className="pf-wl-legend-item">
              <div className="pf-wl-legend-dot" style={{background:s.color}}></div>
              {s.label}
            </div>
          ))}
        </div>
      </div>

      {err && (
        <div className="pf-chart-empty" style={{color:'var(--red-500)',fontSize:12,flexDirection:'column',gap:4}}>
          <i className="ri-error-warning-line" style={{fontSize:20}}></i>
          {err}
        </div>
      )}
      {!err && loading ? (
        <div className="pf-chart-empty"><div className="pf-spinner" style={{width:24,height:24,borderWidth:2}}></div></div>
      ) : !err && (
        <div className="pf-chart">
          {activeMonths.map(mo => (
            <div key={mo} className="pf-chart-group">
              <div className="pf-chart-bars">
                {statuses.map(s => {
                  const val = wl?.[mo]?.[s.key] || 0;
                  const h = val === 0 ? 3 : Math.round((val / maxVal) * 100);
                  return (
                    <div key={s.key} className="pf-chart-bar"
                      style={{background: val ? s.color : 'var(--gray-100)', height:`${h}%`}}
                      data-val={val} />
                  );
                })}
              </div>
              <div className="pf-chart-mo">{MONTHS_LABEL[mo]}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

              {avg
                ? L({es:'En seguimiento',en:'Being tracked'})
                : L({es:'Sin data aún',en:'No data yet'})}
            </span>
          </div>
        </div>

        <div className="pf-hero-divider"></div>

        <div className="pf-hero-stats">
          <div className="pf-mini">
            <div className="pf-mini-ico" style={{background:'var(--sky-100)',color:'var(--sky-700)'}}>
              <i className="ri-layout-grid-line"></i>
            </div>
            <div>
              <div className="pf-mini-num">{(member.pillars||[]).length}</div>
              <div className="pf-mini-lab">{L({es:'pilares',en:'pillars'})}</div>
            </div>
          </div>
          <div className="pf-mini">
            <div className="pf-mini-ico" style={{background:'var(--orange-100)',color:'var(--orange-700)'}}>
              <i className="ri-list-check-2"></i>
            </div>
            <div>
              <div className="pf-mini-num">{totalSkills}</div>
              <div className="pf-mini-lab">{L({es:'competencias',en:'competencies'})}</div>
            </div>
          </div>
          <div className="pf-mini">
            <div className="pf-mini-ico" style={{background:'var(--purple-50)',color:'var(--purple-700)'}}>
              <i className="ri-calendar-check-line"></i>
            </div>
            <div>
              <div className="pf-mini-num">{activeQ} 2025</div>
              <div className="pf-mini-lab">{L({es:'período',en:'period'})}</div>
            </div>
          </div>
        </div>
      </div>

      <AlertsPanel pillars={member.pillars} months={months} L={L} />

      <div className="pf-pillar-grid">
        {(member.pillars||[]).filter(p => p.name.toLowerCase() !== 'role').map((p, i) => (
          <PillarCard key={i} pillar={p} months={months}
            member={member.id} sbScores={sbScores} onSave={onSave} L={L} />
        ))}
      </div>

      <WorkloadChart memberId={member.id} activeMonths={months} L={L} />
    </>
  );
}

// ─── Pending state (no data yet) ─────────────────────────────────────────────
function PendingView({ member, memberIdx, activeQ, L }) {
  const displayName = member.id.replace(/\s*[-–]\s*.*$/, '');
  const color = AVATAR_COLORS[memberIdx % AVATAR_COLORS.length];
  return (
    <div className="pf-pending">
      <div className="pf-pending-avatar" style={{background:color}}>{getInitials(member.id)}</div>
      <div className="pf-pending-name">{displayName}</div>
      <div className="pf-pending-role">{member.role}</div>
      <div className="pf-pending-card">
        <i className="ri-draft-line"></i>
        <div className="pf-pending-card-title">
          {L({es:`Sin data para ${activeQ} 2025`,en:`No data for ${activeQ} 2025`})}
        </div>
        <div className="pf-pending-card-body">
          {L({es:'Agrega los scores en el Google Sheet y se reflejarán aquí automáticamente.',
              en:'Add scores in the Google Sheet and they will appear here automatically.'})}
        </div>
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [data,     setData]     = useState(null);
  const [loading,  setLoading]  = useState(true);
  const [error,    setError]    = useState(null);
  const [selected, setSelected] = useState(null);
  const [lang,     setLang]     = useState('es');
  const [activeQ,  setActiveQ]  = useState('Q3');
  const [sbScores, setSbScores] = useState({});

  const L = o => o[lang];

  async function fetchData() {
    setLoading(true); setError(null);
    try {
      const res  = await fetch(APPS_SCRIPT_URL);
      const json = await res.json();
      setData(json);
      if (!selected && Object.keys(json).length > 0) {
        setSelected(Object.keys(json)[0]);
      }
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }

  async function loadSbScores(memberName) {
    const { data: rows } = await sb.from(SB_TABLE).select('*')
      .eq('member', memberName).eq('year', 2025);
    if (!rows) return;
    const map = {};
    rows.forEach(r => { map[`${r.pillar}|${r.skill}|${r.month}`] = r.score; });
    setSbScores(map);
  }

  async function saveScore(member, pillar, skill, month, score) {
    await sb.from(SB_TABLE).upsert(
      { member, pillar, skill, month, year: 2025, score },
      { onConflict: 'member,pillar,skill,month,year' }
    );
    const key = `${pillar}|${skill}|${month}`;
    setSbScores(prev => ({ ...prev, [key]: score }));
  }

  useEffect(() => { fetchData(); }, []);
  useEffect(() => { if (selected) { setSbScores({}); loadSbScores(selected); } }, [selected]);

  const activeMonths = QUARTERS.find(q => q.id === activeQ)?.months || [];
  const members = data ? Object.entries(data).map(([id, v]) => ({ id, ...v })) : [];
  const memberIdx = members.findIndex(m => m.id === selected);
  const member = members[memberIdx] || null;
  const hasPillarData = member && (member.pillars||[]).some(p =>
    (p.skills||[]).some(sk => MONTHS_ORDER.some(m => sk.scores[m]))
  );

  return (
    <div className="pf-app">
      <Sidebar members={members} selected={selected} onSelect={setSelected}
        activeQ={activeQ} onQChange={setActiveQ} activeMonths={activeMonths} L={L} />

      <div className="pf-main">
        <div className="pf-top">
          <div className="pf-crumb">
            <i className="ri-team-line"></i>
            <span>CPG & Others</span>
            {member && <>
              <i className="ri-arrow-right-s-line"></i>
              <b>{member.id.replace(/\s*[-–]\s*.*$/,'')}</b>
            </>}
            <i className="ri-arrow-right-s-line"></i>
            <span>{L({es:'Performance Review',en:'Performance Review'})}</span>
          </div>
          <div className="pf-top-right">
            <div className="pf-lang">
              <button className={lang==='es'?'on':''} onClick={()=>setLang('es')}>ES</button>
              <button className={lang==='en'?'on':''} onClick={()=>setLang('en')}>EN</button>
            </div>
            <button className="pf-btn pf-btn-secondary" onClick={fetchData}>
              <i className="ri-refresh-line"></i>{L({es:'Actualizar',en:'Refresh'})}
            </button>
          </div>
        </div>

        {loading && (
          <div className="pf-center">
            <div className="pf-spinner"></div>
            <div className="pf-center-label">
              {L({es:'Cargando datos del sheet…',en:'Loading sheet data…'})}
            </div>
          </div>
        )}

        {!loading && error && (
          <div className="pf-center">
            <i className="pf-error-ico ri-wifi-off-line"></i>
            <div className="pf-center-label">{L({es:'No se pudo conectar al sheet.',en:'Could not connect to sheet.'})}</div>
            <button className="pf-btn pf-btn-primary" onClick={fetchData}>
              <i className="ri-refresh-line"></i>{L({es:'Reintentar',en:'Retry'})}
            </button>
          </div>
        )}

        {!loading && !error && member && (
          <div className="pf-content">
            {hasPillarData
              ? <MemberView member={member} memberIdx={memberIdx} months={activeMonths} activeQ={activeQ} sbScores={sbScores} onSave={saveScore} L={L} />
              : <PendingView member={member} memberIdx={memberIdx} activeQ={activeQ} L={L} />
            }
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
